<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widons 2.0</title>
    <meta name="description" content="Widons 2.0 - Sistema Operacional estilo Windows 10 com Google Chrome, Explorador de Arquivos, Lixeira, Adaptadores Wi-Fi e Bluetooth automáticos e execução de programas." />
    <meta property="og:title" content="Widons 2.0" />
    <meta property="og:description" content="Widons 2.0 - Sistema Operacional completo estilo Windows 10." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --accent-color: #0078d7;
        --accent-color-rgb: 0, 120, 215;
      }
      body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Inter', sans-serif;
        background-color: #001226;
        color: #ffffff;
        overflow: hidden; /* Prevent scrollbars on the body */
      }
      @keyframes scale-in {
        from { transform: scale(0.95); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes scale-out {
        from { transform: scale(1); opacity: 1; }
        to { transform: scale(0.95); opacity: 0; }
      }
       @keyframes slide-in-bottom {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-scale-in {
        animation: scale-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-scale-out {
        animation: scale-out 0.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      }

      /* For Window Resizing */
      .resize-handle {
          position: absolute;
          z-index: 10;
      }
      .resize-handle-n { top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
      .resize-handle-s { bottom: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; }
      .resize-handle-e { top: 0; bottom: 0; right: -4px; width: 8px; cursor: ew-resize; }
      .resize-handle-w { top: 0; bottom: 0; left: -4px; width: 8px; cursor: ew-resize; }
      .resize-handle-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nwse-resize; }
      .resize-handle-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
      .resize-handle-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: nesw-resize; }
      .resize-handle-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: nwse-resize; }

      /* Context Menu */
      .context-menu {
          position: absolute;
          z-index: 1000;
          background-color: rgba(10, 20, 30, 0.9);
          backdrop-filter: blur(10px);
          border: 1px solid var(--accent-color);
          border-radius: 8px;
          padding: 8px;
          min-width: 180px;
          box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
      }
      .context-menu-item {
          background: none;
          border: none;
          color: #e0e0e0;
          padding: 8px 12px;
          width: 100%;
          text-align: left;
          border-radius: 4px;
          cursor: pointer;
          font-size: 14px;
          display: flex;
          align-items: center;
          gap: 8px;
      }
      .context-menu-item:hover {
          background-color: var(--accent-color);
          color: #000;
      }
      .context-menu-separator {
          height: 1px;
          background-color: rgba(var(--accent-color-rgb), 0.2);
          margin: 4px 0;
      }
      /* Start Menu & Taskbar */
      .start-menu {
        animation: slide-in-bottom 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      /* Notifications */
      .notification {
        animation: scale-in 0.3s ease-out forwards;
      }
    </style>

{

  }
}
</script>
</head>

</html>
